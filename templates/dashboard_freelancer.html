<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Dashboard - MariLancy</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8fafc;
    }

    .sidebar-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .custom-checkbox {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
      cursor: pointer;
    }

    .job-card-modern {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.02);
      transition: 0.3s;
    }

    .job-card-modern:hover {
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      border-color: #e2e8f0;
    }

    .btn-teal {
      background-color: #2b9c96;
      color: white;
    }
    .btn-teal:hover {
      background-color: #23827d;
    }

    .footer-dark {
      background-color: #000000;
      color: #e5e7eb;
      padding: 60px 40px 30px 40px;
      font-size: 14px;
    }

    .footer-container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.5fr;
      gap: 40px;
      padding-bottom: 40px;
      border-bottom: 1px solid #1f2937;
    }

    .footer-col h4 {
      color: white;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .footer-col ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .footer-col ul li {
      margin-bottom: 12px;
      color: #9ca3af;
      cursor: pointer;
      transition: 0.2s;
    }

    .footer-col ul li:hover {
      color: white;
    }

    .newsletter-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }

    .newsletter-input {
      background-color: transparent;
      border: 1px solid #4b5563;
      color: white;
      padding: 12px 15px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .newsletter-input:focus {
      border-color: #2b9c96;
    }

    .newsletter-btn {
      background-color: #2b9c96;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .newsletter-btn:hover {
      background-color: #23827d;
    }

    .footer-bottom {
      max-width: 1200px;
      margin: 0 auto;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      color: #6b7280;
      font-size: 12px;
    }

    .pagination-container { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      gap: 8px; 
      margin-top: 24px; 
      padding-bottom: 20px;
    }
    .page-btn { 
      width: 40px; height: 40px; border-radius: 50%; 
      display: flex; justify-content: center; align-items: center; 
      background-color: white; color: #4b5563; font-weight: 700; 
      font-size: 14px; cursor: pointer; transition: 0.2s; 
      border: 1px solid #e5e7eb;
      position: relative;
      z-index: 10;      
    }
    .page-btn:hover:not(.disabled):not(.active) { background-color: #f3f4f6; }
    .page-btn.active { background: #2b9c96; color: white; border: none; }
    .page-btn.disabled { opacity: 0.4; cursor: not-allowed; }
    .page-dots { color: #9ca3af; font-weight: bold; }
  </style>
</head>

<body>

  <nav class="fixed top-0 left-0 w-full z-50 bg-black text-white px-8 py-4 flex justify-between items-center">
    <div class="flex-1">
      <a class="text-xl font-bold flex items-center gap-2" href="/freelancer">
        <i class="ri-briefcase-4-line text-2xl"></i> MariLancy
      </a>
    </div>

    <div class="flex-1 flex justify-center gap-8 text-sm font-medium">
      <a href="#" onclick="setActive(this); goHome()" class="text-white border-b-2 border-[#2b9c96] pb-1 font-semibold">Dashboard</a>
      <a href="/freelancer/projects" onclick="setActive(this)" class="nav-link text-gray-400 hover:text-white">Projects</a>
      <a href="/freelancer/profile/view" onclick="setActive(this)" class="nav-link text-gray-400 hover:text-white">Applications</a>
      <a href="/chat" onclick="setActive(this)" class="nav-link text-gray-400 hover:text-white">Messages</a>
    </div>

    <div class="flex-1 flex justify-end items-center gap-5 ">
      <span id="userGreeting" class="text-sm font-medium"></span>
      <div class="profile-box cursor-pointer" onclick="goProfile()">
        <img id="profile_img"
          src="https://ui-avatars.com/api/?name=User"
          class="profile-img w-10 h-10 rounded-full object-cover"
          alt="User"
          onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=User&background=2b9c96&color=fff';">
      </div>
      <button onclick="logout()" class="btn-teal px-5 py-2 rounded-md text-sm font-semibold transition">
        Logout
      </button>
      <div class="relative cursor-pointer" onclick="goNotification()">
        <i class="ri-notification-3-fill text-2xl text-yellow-500"></i>
        <span id="notifBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0 rounded-full hidden">
          0
        </span>
      </div>
    </div>
  </nav>

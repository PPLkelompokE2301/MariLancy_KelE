<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard - MariLancy</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/static/css/style.css?v=<?= timestamp ?>">

</head>

<body class="bg-gray-100">

<nav class="navbar-custom">
  <div class="navbar-inner">
    <a class="logo" href="/admin">MariLancy</a>

    <div class="flex items-center gap-4">
      <span class="text-sm text-gray-600">Admin Panel</span>

      <button onclick="logout()"
        class="px-4 py-2 bg-red-500 hover:bg-red-600 rounded-xl text-white text-sm">
        Logout
      </button>
    </div>
  </div>
</nav>

<div class="max-w-5xl mx-auto mt-10">

  <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>

  <div class="grid grid-cols-3 gap-4">

    <div class="bg-white p-6 rounded-xl shadow">
      <h3 class="text-lg font-semibold">Freelancers</h3>
      <p id="totalFreelancers" class="text-2xl mt-2">-</p>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <h3 class="text-lg font-semibold">Clients</h3>
      <p id="totalClients" class="text-2xl mt-2">-</p>
    </div>

    <div class="bg-white p-6 rounded-xl shadow">
      <h3 class="text-lg font-semibold">Jobs</h3>
      <p id="totalJobs" class="text-2xl mt-2">-</p>
    </div>

  </div>

</div>

<script>

const token = localStorage.getItem("token")
const role = localStorage.getItem("role")

if (!token) {
  alert("Silakan login dulu")
  window.location.href = "/"
}

if (role !== "admin") {
  alert("Akses ditolak (bukan admin)")
  window.location.href = "/"
}


function logout() {
  alert("Berhasil logout")
  localStorage.clear()
  window.location.href = "/"
}


async function safeFetch(url, options = {}) {
  const res = await fetch(url, options)

  if (res.status === 401) {
    alert("Session habis")
    localStorage.clear()
    window.location.href = "/"
    return null
  }

  if (res.status === 403) {
    alert("Forbidden")
    window.location.href = "/"
    return null
  }

  try {
    return await res.json()
  } catch {
    return null
  }
}


async function loadDashboard() {

  const data = await safeFetch("/admin/data", {
    headers: {
      "Authorization": "Bearer " + token
    }
  })

  if (!data) return


  document.getElementById("totalFreelancers").innerText = data.freelancers || 0
  document.getElementById("totalClients").innerText = data.clients || 0
  document.getElementById("totalJobs").innerText = data.jobs || 0
}

loadDashboard()

</script>

</body>
</html>
